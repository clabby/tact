name: CI
on:
  push:
    branches: [main]
  merge_group:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  review-web:
    runs-on: ubuntu-latest
    name: Review Web
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/review
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test review app
        run: bun test
      - name: Build review assets
        run: bun run build
      - name: Typecheck review app
        run: bun run typecheck

  cargo-tests:
    runs-on: ${{ matrix.os }}
    name: Tests (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - name: cargo test
        run: just test --locked

  cargo-build:
    runs-on: ubuntu-latest
    name: Build (${{ matrix.toolchain }})
    timeout-minutes: 20
    continue-on-error: ${{ matrix.toolchain != '1.97.0' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.0", stable, nightly]
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@just
      - name: Check standalone tact package
        run: cargo check --package tact --locked
      - name: build
        run: just build --locked --all-features

  cargo-portability:
    runs-on: ubuntu-latest
    name: Features + WebAssembly
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@just
      - name: Install Worker build tool
        run: cargo install worker-build --version 0.8.5 --locked
      - name: Check tact-memory feature powerset
        run: just check-features
      - name: Check Cloudflare Worker WebAssembly target
        run: just check-wasm --locked
      - name: Install Cloudflare Worker dependencies
        run: npm ci --prefix crates/memory-cloudflare
      - name: Bundle Cloudflare Worker
        run: npm run deploy:check --prefix crates/memory-cloudflare

  cargo-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Clippy
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: taiki-e/install-action@just
      - name: Install Rust stable Clippy toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Rust nightly formatting toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: fmt + lint
        run: just lint

  cargo-doc:
    runs-on: ubuntu-latest
    name: Docs (lint + test)
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: taiki-e/install-action@just
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: doclint
        run: just check-docs
      - name: doctest
        run: just test-docs

  cargo-build-benches:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build Benchmarks
    continue-on-error: true
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: taiki-e/install-action@just
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: build benches
        run: cargo bench --no-run --all
