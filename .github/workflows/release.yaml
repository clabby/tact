name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

# A tag publishes an official release. A merge to main publishes a pre-release of that commit,
# which skips crates.io and is kept only while it is among the most recent.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  BINARY_NAME: tact
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/clabby/tact

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Name the release
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tact") | .version')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease=false
          else
            tag="dev-${GITHUB_SHA::12}"
            prerelease=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Verify tag matches crate version on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi

          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tact") | .version')
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "Tag version $tag_version does not match crate version $crate_version" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: false
      - name: Build with Cargo
        run: cargo build --locked --release --package tact --bin tact --target ${{ matrix.target }}
        env:
          TACT_RELEASE_BUILD: ${{ needs.validate.outputs.prerelease == 'true' && 'pre-release' || '1' }}
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          package_name="${BINARY_NAME}-${{ matrix.target }}-${RELEASE_TAG}"

          mkdir "$package_name"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "$package_name/"
          cp README.md LICENSE.md "$package_name/"
          tar -czf "$package_name.${{ matrix.archive_ext }}" "$package_name"
          shasum -a 256 "$package_name.${{ matrix.archive_ext }}" > "$package_name.${{ matrix.archive_ext }}.sha256"
      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ needs.validate.outputs.tag }}.${{ matrix.archive_ext }}
            ${{ env.BINARY_NAME }}-${{ matrix.target }}-${{ needs.validate.outputs.tag }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  web_assets:
    name: Build Web Assets
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web assets
        shell: bash
        run: TACT_VERSION="${{ needs.validate.outputs.version }}" bun run build
      - name: Typecheck web app
        run: bun run typecheck
      - name: Package web assets
        shell: bash
        run: |
          set -euo pipefail

          archive="tact-web-${RELEASE_TAG}.tar.gz"
          mkdir web
          cp -R dist/. web/
          tar -czf "$archive" web
          shasum -a 256 "$archive" > "${archive}.sha256"
      - name: Upload packaged web assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-assets
          path: |
            web/tact-web-${{ needs.validate.outputs.tag }}.tar.gz
            web/tact-web-${{ needs.validate.outputs.tag }}.tar.gz.sha256
          if-no-files-found: error

  sign:
    name: Sign Release Assets
    needs: [build, web_assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Install rsign2
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: rsign2
      - name: Sign binary artifacts
        shell: bash
        run: |
          set -euo pipefail

          trap 'rm -f minisign.key minisign.pub' EXIT
          rsign generate -f -W -p minisign.pub -s minisign.key
          echo "::add-mask::$(tail -n 1 minisign.key)"

          {
            printf '\n[package.metadata.binstall.signing]\n'
            printf 'algorithm = "minisign"\n'
            printf 'pubkey = "%s"\n' "$(tail -n 1 minisign.pub)"
          } >> bin/tact/Cargo.toml
          cp minisign.pub dist/minisign.pub

          for archive in dist/*.tar.gz; do
            rsign sign -W -s minisign.key -x "${archive}.sig" "${archive}"
          done
      - name: Verify signed release assets
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          for archive in *.tar.gz; do
            test -s "$archive"
            test -s "${archive}.sha256"
            test -s "${archive}.sig"
            shasum -a 256 --check "${archive}.sha256"
            rsign verify "$archive" -P "$(tail -n 1 minisign.pub)" -x "${archive}.sig"
          done

          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = "5"
      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: |
            Cargo.toml
            bin/tact/Cargo.toml
            dist
          if-no-files-found: error

  publish_crates:
    name: Publish Crates
    needs: sign
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed-release
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          save-if: false
      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          publish_package() {
            local package="$1"
            shift
            local version
            local crate
            local local_checksum
            local published_checksum

            version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"${package}\") | .version")
            crate="target/package/${package}-${version}.crate"
            test -f "$crate"
            local_checksum=$(sha256sum "$crate" | cut -d ' ' -f 1)

            for attempt in {1..5}; do
              if cargo publish --locked --no-verify -p "$package" "$@"; then
                return 0
              fi

              if [[ "$attempt" -lt 5 ]]; then
                sleep $((attempt * 15))
              fi
            done

            published_checksum=$(curl --fail --silent --show-error \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --user-agent "tact-release-workflow/${version} (https://github.com/clabby/tact)" \
              "https://crates.io/api/v1/crates/${package}/${version}" \
              | jq -er '.version.checksum')

            if [[ "$published_checksum" != "$local_checksum" ]]; then
              echo "crates.io has different contents for ${package} ${version}" >&2
              return 1
            fi

            echo "cargo publish reported failure, but crates.io has the exact packaged ${package} crate"
          }

          cargo package --locked -p tact-memory
          publish_package tact-memory

          cargo package --locked -p tact-subagents
          publish_package tact-subagents

          cp "${RUNNER_TEMP}/signed-release/bin/tact/Cargo.toml" bin/tact/Cargo.toml
          for attempt in {1..10}; do
            if cargo package --locked --allow-dirty -p tact; then
              break
            fi

            if [[ "$attempt" = 10 ]]; then
              exit 1
            fi

            sleep 15
          done

          publish_package tact --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Publish GitHub Release
    needs: [validate, sign, publish_crates]
    # Pre-releases skip crates.io, so a skipped publication does not block the release.
    if: ${{ !cancelled() && needs.sign.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish_crates.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: .
      - name: Install git-cliff
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: git-cliff@2.13.1
          fallback: none
      - name: Generate release notes
        if: needs.validate.outputs.prerelease != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cp .github/RELEASE_TEMPLATE.md release-notes.md
          printf '\n\n' >> release-notes.md
          git cliff --current --strip all >> release-notes.md
      - name: Generate pre-release notes
        if: needs.validate.outputs.prerelease == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          {
            printf '**Pre-release build of [%s](https://github.com/%s/commit/%s).** ' \
              "${GITHUB_SHA::12}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'It is not an official release: it is built from a commit on main, and it has no crates.io package to hold an independent signing key, so it is verified by checksum only.\n\n'
            git log -1 --format='> %s' "$GITHUB_SHA"
            printf '\nInstall it over an existing tact release install:\n\n'
            printf '%s\n' '```sh' "tact update ${GITHUB_SHA::12}" '```'
            printf '\nReleases are only retained for the most recent merges to main. Each archive is covered by a SHA-256 checksum.\n'
          } > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ needs.validate.outputs.tag }}
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.sig
            dist/minisign.pub
          fail_on_unmatched_files: true

  container_build:
    name: Package Image (${{ matrix.platform }})
    needs: [validate, release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            platform_pair: linux-amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            platform: linux/arm64
            platform_pair: linux-arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: release-bundle
      - name: Install rsign2
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2
        with:
          tool: rsign2
      - name: Extract verified release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          package_name="${BINARY_NAME}-${TARGET}-${RELEASE_TAG}"
          archive="${package_name}.tar.gz"
          mkdir -p "${GITHUB_WORKSPACE}/target/image-context" "${RUNNER_TEMP}/release-package"

          cd release-bundle/dist
          shasum -a 256 --check "${archive}.sha256"
          rsign verify "$archive" -P "$(tail -n 1 minisign.pub)" -x "${archive}.sig"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/release-package" "${package_name}/${BINARY_NAME}"
          install -m 0755 \
            "${RUNNER_TEMP}/release-package/${package_name}/${BINARY_NAME}" \
            "${GITHUB_WORKSPACE}/target/image-context/${BINARY_NAME}"
      - name: Authenticate with container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Package and push image by digest
        id: build
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          RELEASE_BINARY_CONTEXT: target/image-context
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.validate.outputs.tag }}
        with:
          source: .
          files: docker/docker-bake.hcl
          targets: release
          set: |
            release.platform=${{ matrix.platform }}
            release.output=type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Verify image binary matches release binary
        shell: bash
        env:
          DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['release']['containerimage.digest'] }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          container_id=$(docker create --platform "$PLATFORM" "${REGISTRY_IMAGE}@${DIGEST}" /tact)
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "${container_id}:/tact" "${RUNNER_TEMP}/image-tact"
          cmp "${GITHUB_WORKSPACE}/target/image-context/tact" "${RUNNER_TEMP}/image-tact"
      - name: Export image digest
        shell: bash
        env:
          DIGEST: ${{ fromJSON(steps.build.outputs.metadata)['release']['containerimage.digest'] }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-digest-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  container_publish:
    name: Publish Release Image
    needs: [validate, container_build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: release-image-digest-*
          merge-multiple: true
      - name: Authenticate with container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Create and inspect release manifest
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.validate.outputs.tag }}"
          images=()
          for digest in "${RUNNER_TEMP}"/digests/*; do
            images+=("${REGISTRY_IMAGE}@sha256:${digest##*/}")
          done

          test "${#images[@]}" = 2
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags=(--tag "${REGISTRY_IMAGE}:${tag#v}" --tag "${REGISTRY_IMAGE}:latest")
          else
            tags=(--tag "${REGISTRY_IMAGE}:${tag}" --tag "${REGISTRY_IMAGE}:dev")
          fi
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${tag#v}"

  prune_pre_releases:
    name: Prune Old Pre-releases
    needs: [validate, release]
    if: needs.validate.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # How many pre-releases remain published. Older ones are deleted with their tags.
      RETAINED_PRE_RELEASES: "5"
    steps:
      - name: Delete pre-releases beyond the retention limit
        shell: bash
        run: |
          set -euo pipefail

          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"dev-\")))] | sort_by(.createdAt) | reverse | .[${RETAINED_PRE_RELEASES}:] | .[].tagName" \
            | while read -r tag; do
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
