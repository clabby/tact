[project]
name = "tact-harbor-adapter"
version = "0.1.0"
description = "Harbor integration for Tact"
requires-python = ">=3.13,<3.14"
dependencies = [
    "harbor==0.20.0",
    # Match Harbor's universal wheel and avoid native LiteLLM builds on macOS ARM64.
    "litellm==1.86.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_adapter"]
