[package]
name = "tact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
exclude = ["tests/release_pipeline.rs"]
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tar.gz"
bin-dir = "{ name }-{ target }-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
arboard.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
base64.workspace = true
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
dark-light.workspace = true
flate2.workspace = true
fs2.workspace = true
futures-util.workspace = true
image.workspace = true
jsonschema.workspace = true
miette.workspace = true
minisign-verify.workspace = true
nanocodex.workspace = true
png.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
rayon.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
shlex.workspace = true
syntect.workspace = true
tar.workspace = true
tact-memory = { workspace = true, features = ["client", "local", "native-server", "tool"] }
tact-subagents.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
zeroize.workspace = true
zstd.workspace = true

[dev-dependencies]
criterion.workspace = true
rstest.workspace = true
tower.workspace = true

[build-dependencies]
chrono.workspace = true

[features]
harbor-evals = []

[[bench]]
name = "tui"
path = "src/tui/bench.rs"
harness = false
